[package]
name = "gpmf-rs"
version = "0.6.2"
edition = "2024"
description = "Extract, parse GoPro GPMF data from a GoPro MP4 file."
repository = "https://github.com/jenslar/gpmf-rs"
license = "MIT"
keywords = ["gopro", "gpmf", "telemetry", "gps", "sensor", "action camera"]

[dependencies]
rayon = "1.12"
time = {version = "0.3.48", features = ["formatting", "parsing", "macros"]}
walkdir = "2.5"
geojson = {version = "1.0", features = ["geo-types"]}
mp4iter = {git = "https://github.com/jenslar/mp4iter.git"}
jpegiter = {git = "https://github.com/jenslar/jpegiter.git"}
blake3 = "1.8"
binrw = "0.15"
indicatif = { version = "0.18.4", features = ["rayon"]}
log = "0.4.32"
spatio-types = "0.2.3"
gpx = {version = "0.10", optional = true}
geo-types = {version = "0.7.19", optional = true}

[features]
gpx = ["dep:gpx", "dep:geo-types"]
